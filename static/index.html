<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerMate - 진로 상담 챗봇</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1 class="logo">CareerMate</h1>
            <p class="subtitle">진로 고민은 CareerMate에게!</p>
            
            <div class="form-group">
                <input type="text" id="login-id" placeholder="아이디" class="input-field">
            </div>
            <div class="form-group">
                <input type="password" id="login-pw" placeholder="비밀번호" class="input-field">
            </div>
            
            <button onclick="login()" class="btn btn-primary">로그인</button>
            <button onclick="showSignup()" class="btn btn-secondary">회원가입</button>
        </div>
    </div>

    <!-- 회원가입 화면 -->
    <div id="signup-screen" class="screen">
        <div class="signup-container">
            <h2>회원가입</h2>
            <p class="info-text">가입자의 모든 정보를 빠짐 없이 넣어주세요</p>
            
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="signup-id" class="input-field">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="signup-pw" class="input-field">
            </div>
            <div class="form-group">
                <label>별칭</label>
                <input type="text" id="signup-name" class="input-field">
            </div>
            <div class="form-group">
                <label>성별</label>
                <select id="signup-gender" class="input-field">
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                    <option value="밝히지 않음">밝히지 않음</option>
                    <option value="그 외">그 외</option>
                </select>
            </div>
            <div class="form-group">
                <label>나이: <span id="age-display">16</span>세</label>
                <input type="range" id="signup-age" min="13" max="19" value="16" class="slider" oninput="updateAge()">
            </div>
            <div class="form-group">
                <label>학교</label>
                <select id="signup-school" class="input-field">
                    <option value="하안북중학교">하안북중학교</option>
                    <option value="봉담중학교">봉담중학교</option>
                    <option value="안천중학교">안천중학교</option>
                    <option value="가림중학교">가림중학교</option>
                    <option value="한국디지털미디어고등학교">한국디지털미디어고등학교</option>
                    <option value="동탄국제고등학교">동탄국제고등학교</option>
                </select>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="agree">
                <label for="agree">CareerMate 이용약관 및 개인정보 처리방침에 동의합니다.</label>
            </div>
            
            <button onclick="signup()" class="btn btn-primary">가입하기</button>
            <button onclick="showLogin()" class="btn btn-secondary">취소</button>
        </div>
    </div>

    <!-- 채팅 화면 -->
    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <h2>CareerMate</h2>
            <div class="header-buttons">
                <button onclick="clearChat()" class="btn-small">채팅 초기화</button>
                <button onclick="logout()" class="btn-small">로그아웃</button>
            </div>
        </div>
        
        <div id="chat-area" class="chat-area">
            <!-- 채팅 메시지가 여기에 동적으로 추가됨 -->
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="메시지를 입력하세요..." class="input-field" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" class="btn-send">전송</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
